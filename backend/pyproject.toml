# Ruff configuration for the LookAtify backend.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    # Blind exception catching is deliberate: the model, PIL and the HTTP
    # layer all raise broad exceptions, and every one of them is turned into
    # a user-readable message at the boundary.
    "BLE001",
    # Long lines are handled by the formatter, not the linter.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests may use long assertion lines and unpack values they do not use.
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"
